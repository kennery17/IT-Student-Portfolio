
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        .info {
            padding: 12px;
            margin: 10px 0;
            background: #f4f6f9;
            border-radius: 6px;
        }

        .label {
            font-weight: bold;
            color: #243b55;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Information</h1>

        <div class="info">
            <span class="label">Name:</span> John Kennery Arteta
        </div>

        <div class="info">
            <span class="label">Age:</span> 21
        </div>

        <div class="info">
            <span class="label">Course:</span> BS Information Technology
        </div>

        <div class="info">
            <span class="label">Year Level:</span> 3rd Year
        </div>

        <div class="info">
            <span class="label">Department:</span> Information Technology
        </div>

        <div class="info">
            <span class="label">Skills:</span> HTML, CSS, Basic Python
        </div>
    </div>

</body>
</html>
